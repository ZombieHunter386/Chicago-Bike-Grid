# Render Web Service definition for chicago-bike-advocacy-map.
# Per Plan 2C Task 1. Render imports this on the first deploy; subsequent
# changes go via the dashboard (sync: false fields stay user-managed).
#
# UPLOAD_TOKEN is the secret guarding /admin/upload-bikemap-db. Generate
# with: python -c "import secrets; print(secrets.token_urlsafe(32))"
# and paste into the dashboard the first time the service is created.
services:
  - type: web
    name: chicago-bike-advocacy-map
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: bikemap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BIKEMAP_DB_PATH
        value: /var/data/bikemap.db
      - key: CACHE_DB_PATH
        value: /var/data/cache.db
      - key: NOMINATIM_USER_AGENT
        value: chicago-bike-advocacy-map/1.0
      - key: MIN_STREETS
        value: "10000"
      - key: APP_BOOTSTRAP
        value: "1"
      - key: PORT
        value: "8000"
      # UPLOAD_TOKEN: dashboard-managed (not in git). Wires up
      # /admin/upload-bikemap-db when set — endpoint 404s when unset.
      - key: UPLOAD_TOKEN
        sync: false
