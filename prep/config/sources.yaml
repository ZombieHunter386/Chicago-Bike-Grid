# prep/config/sources.yaml
# Source URLs and metadata for the prep pipeline. Update here, not in code.
#
# Dataset IDs verified 2026-05-05 against the live Chicago Data Portal.
# See docs/dataset-ids.md for the verification record + rationale on speed_limits omission.

sources:
  hin:
    name: "Cook County HIN (2025 SAP)"
    type: "arcgis_feature_service"
    # CMAP Cook County Safety Action Plan Traffic Safety Analysis — verified 2026-05-05.
    # Source AGOL item: https://www.arcgis.com/home/item.html?id=1ee2e1bd1ddd451bb6061adbeed4c938
    # Service hosts 9 layers; we consume layer 6 (HIN Segment, Polyline) and layer 5
    # (HIN Intersection, Point). Counts as of 2026-05-05: 1,442 segments / 1,359 intersections.
    # All features are HIN-flagged via HIN_Filter ∈ {"Comprehensive & Contextual",
    # "Comprehensive Only", "Contextual Only"}; intersections also have HIN_Intx_CPM_Rank.
    # NB: native CRS is WKID 102671 (NAD83 / Illinois East, US ft); fetcher must request
    # `outSR=4326` to align with our storage CRS.
    segments_url: "https://services5.arcgis.com/LcMXE3TFhi1BSaCY/arcgis/rest/services/Cook_County_SAP_Traffic_Safety_Analysis/FeatureServer/6"
    intersections_url: "https://services5.arcgis.com/LcMXE3TFhi1BSaCY/arcgis/rest/services/Cook_County_SAP_Traffic_Safety_Analysis/FeatureServer/5"
    refresh_cadence: "monthly"

  cook_lts:
    name: "Cook County Level of Traffic Stress (2023)"
    type: "arcgis_mapserver_layer"
    # Cook County DoTH "DOTH_expanded" service, layer 14 — LTS 1-4 for every
    # roadway segment in the Chicago metro area, UMN Accessibility Observatory
    # methodology over 2023 OSM. Verified 2026-07-29: 207,459 records
    # (LTS 1: 153,880 · 2: 2,858 · 3: 10,985 · 4: 39,736). way_id is a real
    # OSM way id (spot-checked: 24072568 = North Marmora Avenue), so matching
    # is an attribute-only way-ID join — geometry is never fetched.
    # Hub page: https://hub-cookcountyil.opendata.arcgis.com/datasets/cookcountyil::level-of-traffic-stress-2023
    # Replaced the Mellow Bike Map as the stress baseline (2026-07-29). The CDOT
    # layers below remain, as an improve-only override (see design §3.3).
    layer_url: "https://gis.cookcountyil.gov/traditional/rest/services/DOTH_expanded/MapServer/14"
    refresh_cadence: "annual"

  cdot_bike_network:
    name: "CDOT Chicago Bikeway Network (on-street, facility type)"
    type: "arcgis_feature_service"
    # Improve-only override on the Cook County LTS baseline (design §3.3): this
    # Jan-2025 layer knows about facilities built after the county's 2023 OSM
    # snapshot, so it can lower a street's LTS but never raise it.
    # Discovered via the 'Existing Chicago Bike Facilities' instant app
    # (appid d4085fb1e59b4eb69a119a4428868ee6) -> web map
    # a693899119c34a71a1e9120802633e6a -> layer "Bike Network (Jan 2025)".
    # 931 polyline features, last edited Jan 2025. outSR honored at 4326.
    # Facility-type field is BIKE_DSPLY (abbreviated, single-word values):
    #   PROTECTED -> LTS 1, NEIGHBORHOOD -> LTS 1,
    #   BUFFERED  -> LTS 2, BIKE         -> LTS 2,
    #   SHARED    -> no override (sharrow: paint, no physical protection).
    # NB: the newer Sep-2025 and Dec-2025 snapshots in the same app are
    # attribute-query-only (returnGeometry=true 400s), so unusable for the
    # spatial match — this Jan-2025 "Final_Public" layer is the most current one
    # that exports geometry. The Apr-2023 layer (Chicago_Bike_Facilities_2023,
    # field DISPLAYROU, full-name vocab) is the stable fallback if needed; the
    # classifier's facility table covers both vocabularies.
    on_street_url: "https://services.arcgis.com/G3nmNsarwQblLhip/arcgis/rest/services/Bikeway_Network_2024_Final_Public/FeatureServer/0"
    facility_type_field: "BIKE_DSPLY"
    refresh_cadence: "quarterly"

  cdot_off_street_trails:
    name: "CDOT Chicago Off-Street Bike Trails"
    type: "arcgis_feature_service"
    # Off-street layer "Off-Street Trails (Sept 2025)" from the same web map.
    # 88 polyline features, last edited Nov 2024. outSR honored at 4326, geometry
    # exports fine. All features -> LTS 1 unconditionally, so the facility-type
    # field is not consulted for this layer; the spatial match is also
    # bearing-optional here because trails legitimately cross streets.
    trails_url: "https://services7.arcgis.com/A03QrhyHnDaUmK0W/arcgis/rest/services/Trails_Network_2024_11_18/FeatureServer/0"
    refresh_cadence: "quarterly"

  cdp_alderman_offices:
    name: "Chicago Aldermanic Ward Offices"
    type: "socrata"
    domain: "data.cityofchicago.org"
    dataset_id: "htai-wnw4"  # verified — 'Ward Offices'
    refresh_cadence: "monthly"

  cdp_library_branches:
    name: "Chicago Public Library Branches"
    type: "socrata"
    domain: "data.cityofchicago.org"
    dataset_id: "x8fc-8rcq"  # verified — 'Libraries - Locations, Contact Information, and Usual Hours of Operation'
    refresh_cadence: "monthly"

target:
  name: "Chicago"
  bbox:
    min_lat: 41.6440
    max_lat: 42.0230
    min_lng: -87.9402
    max_lng: -87.5240
